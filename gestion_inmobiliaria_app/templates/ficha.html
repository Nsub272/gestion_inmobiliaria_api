<a class="ficha" href="{% url 'detalle_propiedad' p.pk %}">
    <div class="imagen t{{ p.tono }}">
        <span class="etiqueta">{{ p.tipo.nombre }}</span>
        <svg viewBox="0 0 80 80" aria-hidden="true"><path d="M10 38L40 12l30 26v30H10z" fill="#EDF1EE"/><rect x="33" y="44" width="14" height="24" fill="#16342B"/><path d="M5 40L40 9l35 31" fill="none" stroke="#B3304D" stroke-width="5" stroke-linecap="round"/></svg>
    </div>
    <div class="cuerpo">
        <h3>{{ p.titulo }}</h3>
        <p class="ubicacion">{{ p.comuna.nombre }}, {{ p.comuna.region.nombre }}</p>
        <div class="datos">
            <span>{{ p.superficie_m2|floatformat:"-1" }} m²</span>
            <span>{{ p.dormitorios }} dorm.</span>
            <span>{{ p.banios }} baños</span>
        </div>
        <span class="precio">{{ p.precio_texto }}</span>
    </div>
</a>
